<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stérilisation — Cabinet Dentaire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --rose:#C73D6B;--rose-d:#9E2A4F;--rose-l:#FEF0F4;--rose-m:#F2BACE;
  --mauve:#7B3399;--mauve-l:#F5EEFA;--mauve-m:#CEAAE8;
  --green:#1A6640;--green-l:#E8F5EE;
  --red:#991A1A;--red-l:#FEE8E8;
  --text:#1A0A10;--text-m:#6B3A50;--text-l:#B08090;
  --border:#EEC8D8;--bg:#FBF6F8;--white:#FFFFFF;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:28px 20px 60px}

.form-title{font-size:18px;font-weight:700;color:var(--rose-d);margin-bottom:6px}
.form-subtitle{font-size:12px;color:var(--text-l);margin-bottom:20px}
.autofill-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-l);color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:16px}
.section-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-l);margin:20px 0 10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--text-m);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-appearance:none}
.field input:focus,.field select:focus{outline:none;border-color:var(--rose)}
.field input[readonly]{background:var(--rose-l);color:var(--rose-d);font-weight:700;cursor:default}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tests-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.test-field label{display:block;font-size:10px;font-weight:700;color:var(--text-m);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.test-field select{width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:9px 8px;font-size:11px;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-appearance:none}
.sel-ok{background:#E8F5EE!important;border-color:#6DB88A!important;color:#1A6640!important;font-weight:700!important}
.sel-nok{background:#FEE8E8!important;border-color:#E88A8A!important;color:#991A1A!important;font-weight:700!important}
.sel-na{background:#f8f4f6!important;color:var(--text-l)!important}
.btn-go{width:100%;max-width:460px;background:var(--rose);color:var(--white);border:none;border-radius:11px;padding:16px;font-size:16px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;margin-top:8px}
.btn-go:hover{opacity:.9}

#screen-print{display:none;min-height:100vh;background:var(--bg)}
.print-topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.print-topbar-left{font-size:14px;font-weight:700;color:var(--rose-d)}
.print-topbar-right{display:flex;gap:10px}
.btn-back{background:var(--white);color:var(--text-m);border:1.5px solid var(--border);border-radius:9px;padding:9px 16px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:700}
.btn-print{background:var(--rose);color:var(--white);border:none;border-radius:9px;padding:9px 20px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer}
.print-hint{background:var(--rose-l);border:1px solid var(--rose-m);border-radius:9px;padding:12px 16px;font-size:12px;color:var(--rose-d);margin:16px 24px;line-height:1.6}
.etiq-grid{padding:20px 24px 40px;display:flex;flex-direction:column;gap:8px}

/* ═══════════════════════════
   ÉTIQUETTE CYCLE — écran
   62mm large, hauteur auto
═══════════════════════════ */
.etiq-cycle{
  width:62mm;
  background:white;
  border:1px solid #ccc;
  border-radius:2px;
  font-family:'DM Sans',sans-serif;
  padding:2.5mm 3mm;
  display:flex;
  flex-direction:column;
  gap:1.5mm;
}
.ec-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:0.5px solid #ddd;
  padding-bottom:1.5mm;
  margin-bottom:0.5mm;
}
.ec-num{font-size:13pt;font-weight:700;color:#000;line-height:1}
.ec-sublabel{font-size:5.5pt;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-top:.5mm}
.ec-result{font-size:7pt;font-weight:700;color:#000;border:1.5px solid #000;padding:2px 6px;border-radius:2px;align-self:center}
.ec-result.nok{border-style:dashed}
.ec-rows{display:grid;grid-template-columns:1fr 1fr;gap:.5mm 4mm}
.ec-row{display:flex;gap:1.5mm;font-size:6.5pt;font-weight:700;color:#000;line-height:1.4}
.ec-row span:first-child{color:#555;font-weight:400;flex-shrink:0;min-width:8mm}
.ec-tests{display:flex;gap:2mm;flex-wrap:wrap;border-top:0.5px solid #ddd;padding-top:1.5mm;margin-top:.5mm}
.ec-test{font-size:6pt;font-weight:700;color:#000;border:1px solid #000;padding:1px 4px;border-radius:2px;white-space:nowrap}
.ec-test.na{color:#777;border-color:#777;font-weight:400}
.ec-test.nok{border-style:dashed}

/* ═══════════════════════════
   IMPRESSION DK-22205
   62mm large, longueur auto
   Paysage, coupe auto
═══════════════════════════ */
@media print{
  @page{
    size:62mm 35mm;
    margin:0;
  }
  html,body{
    width:62mm;
    height:35mm;
    margin:0;padding:0;
    background:white;
  }
  #screen-form,.print-topbar,.print-hint{display:none!important}
  #screen-print{display:block!important}
  .etiq-grid{
    display:block;
    padding:0;margin:0;
    width:62mm;
    height:35mm;
  }
  .etiq-cycle{
    width:62mm!important;
    height:35mm!important;
    margin:0!important;
    padding:2mm 2.5mm!important;
    border:none!important;
    border-radius:0!important;
    display:flex!important;
    flex-direction:column!important;
    gap:1mm!important;
    page-break-after:avoid!important;
    break-after:avoid!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
    background:white!important;
    overflow:hidden!important;
  }
  *{color:#000!important;font-weight:700!important;background:transparent!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .etiq-cycle{background:white!important}
  .ec-row span:first-child{color:#000!important;font-weight:700!important}
  .ec-test.na{color:#555!important;border-color:#555!important;font-weight:400!important}
  .ec-result.nok,.ec-test.nok{border-style:dashed!important}
}
</style>
</head>
<body>

<div id="screen-form" style="max-width:480px;margin:0 auto">
  <div class="form-title">🛡️ Étiquettes stérilisation</div>
  <div class="form-subtitle">Pré-rempli depuis Notion ou remplis manuellement.</div>
  <div id="autofill-badge" style="display:none" class="autofill-badge">✓ Données pré-remplies depuis Notion</div>

  <div class="section-label">Cycle autoclave</div>
  <div class="field-row">
    <div class="field"><label>N° de cycle</label><input type="text" id="f-num" placeholder="0001"></div>
    <div class="field"><label>Date</label><input type="date" id="f-date" onchange="calcDLU()"></div>
  </div>
  <div class="field">
    <label>Programme</label>
    <select id="f-prog">
      <option>134°C — 18 min (Prion)</option>
      <option>134°C — 3,5 min</option>
      <option>121°C — 15 min</option>
    </select>
  </div>
  <div class="field-row">
    <div class="field">
      <label>Conditionnement</label>
      <select id="f-cond" onchange="calcDLU()">
        <option value="180">Sachet scellé — 6 mois</option>
        <option value="90">Sachet simple — 3 mois</option>
        <option value="365">Conteneur — 12 mois</option>
        <option value="7">Non conditionné — 7 j</option>
      </select>
    </div>
    <div class="field"><label>DLU (auto)</label><input type="text" id="f-dlu" readonly placeholder="—"></div>
  </div>
  <div class="field">
    <label>Opérateur</label>
    <select id="f-op">
      <option value="O. Tourrel">Océane Tourrel</option>
      <option value="Dr E. Charpentier">Dr Eva Charpentier</option>
    </select>
  </div>
  <div class="field">
    <label>Nb de sachets</label>
    <input type="number" id="f-sachets" placeholder="0" min="0">
  </div>

  <div class="section-label">Tests du jour</div>
  <div class="tests-grid">
    <div class="test-field"><label>Prion</label>
      <select id="f-prion" onchange="colorSel(this)">
        <option value="ok">✓ Conforme</option>
        <option value="nok">✗ Non conforme</option>
        <option value="na" selected>— N/R</option>
      </select>
    </div>
    <div class="test-field"><label>Hélix</label>
      <select id="f-helix" onchange="colorSel(this)">
        <option value="ok">✓ Conforme</option>
        <option value="nok">✗ Non conforme</option>
        <option value="na" selected>— N/R</option>
      </select>
    </div>
    <div class="test-field"><label>Vacuum</label>
      <select id="f-vacuum" onchange="colorSel(this)">
        <option value="ok">✓ Conforme</option>
        <option value="nok">✗ Non conforme</option>
        <option value="na" selected>— N/R</option>
      </select>
    </div>
    <div class="test-field"><label>Résultat</label>
      <select id="f-res" onchange="colorSel(this)">
        <option value="ok">✓ Conforme</option>
        <option value="nok">✗ Défaut</option>
      </select>
    </div>
  </div>

  <button class="btn-go" onclick="generer()">Générer l'étiquette →</button>
</div>

<div id="screen-print">
  <div class="print-topbar">
    <div class="print-topbar-left">🛡️ <span id="print-title">Étiquette cycle</span></div>
    <div class="print-topbar-right">
      <button class="btn-back" onclick="retour()">← Modifier</button>
      <button class="btn-print" onclick="window.print()">🖨 Imprimer</button>
    </div>
  </div>
  <div class="print-hint">
    <strong>Brother QL-820NWBc + DK-22205 :</strong> Imprimer → Brother → format <strong>62mm continu</strong> → <strong>Paysage</strong> → Imprimer. L'imprimante coupe automatiquement.
  </div>
  <div class="etiq-grid" id="etiq-grid"></div>
</div>

<script>
(function(){
  document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
  var p=new URLSearchParams(window.location.search);
  var has=false;
  if(p.get('num')){document.getElementById('f-num').value=p.get('num');has=true;}
  if(p.get('date')){document.getElementById('f-date').value=p.get('date');has=true;}
  if(p.get('prion')){var e=document.getElementById('f-prion');e.value=p.get('prion');colorSel(e);}
  if(p.get('helix')){var e=document.getElementById('f-helix');e.value=p.get('helix');colorSel(e);}
  if(p.get('vacuum')){var e=document.getElementById('f-vacuum');e.value=p.get('vacuum');colorSel(e);}
  if(p.get('res')){var e=document.getElementById('f-res');e.value=p.get('res');colorSel(e);}
  ['f-prion','f-helix','f-vacuum','f-res'].forEach(function(id){colorSel(document.getElementById(id));});
  if(has) document.getElementById('autofill-badge').style.display='inline-flex';
  calcDLU();
})();

function fmtDate(s){
  if(!s)return'—';
  return new Date(s+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function calcDLU(){
  var s=document.getElementById('f-date').value;
  var n=parseInt(document.getElementById('f-cond').value);
  var el=document.getElementById('f-dlu');
  if(!s){el.value='';return;}
  var d=new Date(s+'T00:00:00');
  d.setDate(d.getDate()+n);
  el.value=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function colorSel(sel){
  sel.classList.remove('sel-ok','sel-nok','sel-na');
  sel.classList.add(sel.value==='ok'?'sel-ok':sel.value==='nok'?'sel-nok':'sel-na');
}
function tc(v){return v==='ok'?'ok':v==='nok'?'nok':'na';}
function tl(v,n){return v==='ok'?'✓ '+n:v==='nok'?'✗ '+n:'— '+n;}

function generer(){
  var num   =document.getElementById('f-num').value.trim()||'?';
  var date  =document.getElementById('f-date').value;
  var prog  =document.getElementById('f-prog').value;
  var dlu   =document.getElementById('f-dlu').value||'—';
  var op    =document.getElementById('f-op').options[document.getElementById('f-op').selectedIndex].value;
  var cond  =document.getElementById('f-cond').options[document.getElementById('f-cond').selectedIndex].text.split('—')[0].trim();
  var sachets=document.getElementById('f-sachets').value||'0';
  var prion =document.getElementById('f-prion').value;
  var helix =document.getElementById('f-helix').value;
  var vacuum=document.getElementById('f-vacuum').value;
  var res   =document.getElementById('f-res').value;

  var dateStr  =fmtDate(date);
  var progShort=prog.split('(')[0].trim();

  var grid=document.getElementById('etiq-grid');
  grid.innerHTML='';

  var ce=document.createElement('div');
  ce.className='etiq-cycle';
  ce.innerHTML=
    '<div class="ec-top">'+
      '<div>'+
        '<div class="ec-num">Cycle '+num+'</div>'+
        '<div class="ec-sublabel">Stérilisation autoclave</div>'+
      '</div>'+
      '<div class="ec-result '+tc(res)+'">'+(res==='ok'?'✓ Conforme':'✗ Défaut')+'</div>'+
    '</div>'+
    '<div class="ec-rows">'+
      '<div class="ec-row"><span>Date</span><span>'+dateStr+'</span></div>'+
      '<div class="ec-row"><span>DLU</span><span>'+dlu+'</span></div>'+
      '<div class="ec-row"><span>Prog.</span><span>'+progShort+'</span></div>'+
      '<div class="ec-row"><span>Cond.</span><span>'+cond+'</span></div>'+
      '<div class="ec-row"><span>Op.</span><span>'+op+'</span></div>'+
      '<div class="ec-row"><span>Sachets</span><span>'+sachets+'</span></div>'+
    '</div>'+
    '<div class="ec-tests">'+
      '<span class="ec-test '+tc(prion)+'">'+tl(prion,'Prion')+'</span>'+
      '<span class="ec-test '+tc(helix)+'">'+tl(helix,'Hélix')+'</span>'+
      '<span class="ec-test '+tc(vacuum)+'">'+tl(vacuum,'Vacuum')+'</span>'+
    '</div>';
  grid.appendChild(ce);

  document.getElementById('print-title').textContent='Cycle '+num;
  document.getElementById('screen-form').style.display='none';
  document.getElementById('screen-print').style.display='block';
  window.scrollTo(0,0);
}

function retour(){
  document.getElementById('screen-form').style.display='block';
  document.getElementById('screen-print').style.display='none';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
